<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="lilacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4B5FF" />
      <stop offset="50%" stop-color="#B87CF8" />
      <stop offset="100%" stop-color="#7B78FF" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g transform="rotate(-3 256 256)">
    <!-- Top-Left Corner Bracket -->
    <path d="M 120 220 L 120 148 C 120 126 138 108 160 108 L 232 108" 
          fill="none" stroke="url(#lilacGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Top-Right Corner / Camera Shutter Ring Motif -->
    <path d="M 310 108 L 360 108 C 382 108 400 126 400 148 L 400 200" 
          fill="none" stroke="url(#lilacGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Viewfinder dot / flash -->
    <circle cx="395" cy="115" r="14" fill="url(#lilacGrad)" />

    <!-- Bottom-Left Corner Bracket -->
    <path d="M 120 290 L 120 364 C 120 386 138 404 160 404 L 232 404" 
          fill="none" stroke="url(#lilacGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom-Right Corner Bracket -->
    <path d="M 330 404 L 360 404 C 382 404 400 386 400 364 L 400 290" 
          fill="none" stroke="url(#lilacGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- INTERIOR EXPRESSIVE GOOFY FACE -->
    <!-- Left Wink Eye (Arch) -->
    <path d="M 175 228 C 185 208 215 208 225 228" 
          fill="none" stroke="url(#lilacGrad)" stroke-width="30" stroke-linecap="round" />

    <!-- Right Eye (Playful circle / lens / pupil) -->
    <circle cx="295" cy="220" r="32" fill="none" stroke="url(#lilacGrad)" stroke-width="26" />
    <circle cx="295" cy="220" r="10" fill="url(#lilacGrad)" />

    <!-- Mischievous Grin / Mouth -->
    <path d="M 175 285 C 220 330 290 325 335 280" 
          fill="none" stroke="url(#lilacGrad)" stroke-width="28" stroke-linecap="round" />

    <!-- Sticking-out Tongue breaking slightly downward -->
    <path d="M 235 308 C 235 348 245 372 262 372 C 279 372 289 348 289 304 Z" 
          fill="url(#lilacGrad)" stroke="url(#lilacGrad)" stroke-width="6" stroke-linejoin="round" />
    <line x1="262" y1="318" x2="262" y2="352" stroke="#0C0E1A" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>